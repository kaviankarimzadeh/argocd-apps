crds:
  create: false

alloy:
  configMap:
    create: false
    name: alloy-metrics
    key: config.alloy

  clustering:
    enabled: true
    name: "alloy-metrics"

  enableReporting: false

  mounts:
    # -- Mount /var/log -- we need /var/log/pods/*$1/*.log
    varlog: false
    # -- Mount /var/lib/docker/containers -- we need /var/log/pods/*$1/*.log
    dockercontainers: false

  # -- Resource requests and limits to apply to the Grafana Alloy container.
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

controller:
  type: 'statefulset'

ingress:
  enabled: false
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    cert-manager.io/cluster-issuer: letsencrypt-prod
  faroPort: 12345 
  pathType: Prefix
  hosts:
    - alloy-metrics.achaemenid.nl
  tls:
   - secretName: alloy-metrics-tls
     hosts:
       - alloy-metrics.achaemenid.nl