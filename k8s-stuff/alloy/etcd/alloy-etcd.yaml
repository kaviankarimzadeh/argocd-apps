apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-etcd
data:
  config.alloy: |

    prometheus.scrape "etcd_local" {
      targets = [
        {
          "__address__" = "127.0.0.1:2379",
          "job"         = "etcd",
          "instance"    = sys.env("HOSTNAME"),
          "node"        = sys.env("HOSTNAME"),
          "etcd_addr"   = "127.0.0.1:2379",
        },
      ]

      scheme          = "https"
      metrics_path    = "/metrics"
      scrape_interval = "15s"
      scrape_timeout  = "10s"

      tls_config {
        ca_file   = "/etc/kubernetes/pki/etcd/ca.crt"
        cert_file = "/etc/kubernetes/pki/etcd/healthcheck-client.crt"
        key_file  = "/etc/kubernetes/pki/etcd/healthcheck-client.key"
      }

      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.remote_write "default" {
        external_labels = {
          cluster = "cloudnl",
        }
        endpoint {
            url = "http://prometheus-server.monitoring/api/v1/write"
        }
    }