apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-metrics
data:
  config.alloy: |

    discovery.kubernetes "cilium_pods" {
      role = "pod"
      namespaces {
        names = ["cilium"]
      }
    }

    // ---- Agent (port 9962) ----
    discovery.relabel "cilium_agent" {
      targets = discovery.kubernetes.cilium_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        replacement  = "cilium/cilium-agent"
        target_label = "job"
      }

      // Only keep cilium-agent pods
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        action        = "keep"
        regex         = "cilium-agent"
      }
      // Only scrape the metrics port
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        action        = "keep"
        regex         = "9962"
      }
    }

    // ---- Operator (port 9963) ----
    discovery.relabel "cilium_operator" {
      targets = discovery.kubernetes.cilium_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        replacement  = "cilium/cilium-operator"
        target_label = "job"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        action        = "keep"
        regex         = "cilium-operator"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        action        = "keep"
        regex         = "9963"
      }
    }

    // ---- Envoy (port 9964) ----
    discovery.relabel "cilium_envoy" {
      targets = discovery.kubernetes.cilium_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        replacement  = "cilium/cilium-envoy"
        target_label = "job"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        action        = "keep"
        regex         = "cilium-envoy"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        action        = "keep"
        regex         = "9964"
      }
    }

    // ---- Hubble (port 9965) ----
    discovery.relabel "cilium_hubble" {
      targets = discovery.kubernetes.cilium_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        replacement  = "cilium/hubble"
        target_label = "job"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        action        = "keep"
        regex         = "cilium-agent"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        action        = "keep"
        regex         = "9965"
      }
    }

    discovery.kubernetes "goldpinger" {
        role = "pod"
        namespaces {
            names = [ "goldpinger"]
        }
    }

    discovery.relabel "goldpinger" {
        targets = discovery.kubernetes.goldpinger.targets

        rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action = "replace"
            target_label = "namespace"
        }

        rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            action = "replace"
            target_label = "pod"
        }

        rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "container"
        }

        rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            separator = "/"
            regex = "(.*)/(.*)"
            replacement = "${1}/${2}"
            target_label = "job"
        }
    }

    discovery.kubernetes "kube_apiserver" {
      role = "endpointslice"
      selectors {
        role = "endpointslice"
        label = "kubernetes.io/service-name=kubernetes"
      }
      namespaces {
        names = ["default"]
      }
    }

    discovery.relabel "kube_apiserver" {
      targets = discovery.kubernetes.kube_apiserver.targets

      rule {
        source_labels = ["__meta_kubernetes_endpointslice_port_name"]
        regex         = "https"
        action        = "keep"
      }
    }

    discovery.kubernetes "coredns" {
      role = "service"
      selectors {
        role = "service"
        label = "k8s-app=kube-dns"
      }
      namespaces {
        names = ["kube-system"]
      }
    }

    discovery.relabel "coredns" {
      targets = discovery.kubernetes.coredns.targets

      rule {
        source_labels = ["__meta_kubernetes_service_port_name"]
        regex         = "metrics"
        action        = "keep"
      }
    }

    discovery.kubernetes "kube_state_metrics" {
      role = "service"
      selectors {
        role = "service"
        label = "app.kubernetes.io/name=kube-state-metrics"
      }
      namespaces {
        names = ["monitoring"]
      }
    }

    discovery.kubernetes "metrics_server" {
      role = "pod"
      namespaces {
        names = ["monitoring"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/name=metrics-server"
      }
    }

    discovery.relabel "metrics_server" {
      targets = discovery.kubernetes.metrics_server.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex         = "https"
        action        = "keep"
      }
    }

    discovery.kubernetes "cert_manager" {
      role = "service"
      namespaces {
        names = ["cert-manager"]
      }
      selectors {
        role  = "service"
        field = "metadata.name=cert-manager"
        label = "app.kubernetes.io/component=controller"
      }
    }

    prometheus.scrape "goldpinger" {
        targets = discovery.relabel.goldpinger.output
        forward_to = [prometheus.remote_write.default.receiver]
        scrape_interval = "15s"
        metrics_path = "/metrics"
    }

    prometheus.scrape "kube_apiserver" {
      job_name   = "kubernetes-apiserver"
      targets    = discovery.relabel.kube_apiserver.output
      scheme     = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.scrape "coredns" {
      targets    = discovery.relabel.coredns.output
      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.scrape "kube_state_metrics" {
      targets    = discovery.kubernetes.kube_state_metrics.targets
      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.scrape "metrics_server" {
      targets           = discovery.relabel.metrics_server.output
      forward_to        = [prometheus.remote_write.default.receiver]
      scheme            = "https"
      metrics_path      = "/metrics"

      tls_config {
        insecure_skip_verify = true
      }
    }

    prometheus.scrape "cilium_agent" {
      targets         = discovery.relabel.cilium_agent.output
      scrape_interval = "30s"
      metrics_path    = "/metrics"
      scheme          = "http"
      honor_labels    = true
      forward_to      = [prometheus.remote_write.default.receiver]
    }

    prometheus.scrape "cilium_operator" {
      targets         = discovery.relabel.cilium_operator.output
      scrape_interval = "30s"
      metrics_path    = "/metrics"
      scheme          = "http"
      honor_labels    = false
      forward_to      = [prometheus.remote_write.default.receiver]
    }

    prometheus.scrape "cilium_envoy" {
      targets         = discovery.relabel.cilium_envoy.output
      scrape_interval = "30s"
      metrics_path    = "/metrics"
      scheme          = "http"
      honor_labels    = false
      forward_to      = [prometheus.remote_write.default.receiver]
    }

    prometheus.scrape "cilium_hubble" {
      targets         = discovery.relabel.cilium_hubble.output
      scrape_interval = "30s"
      metrics_path    = "/metrics"
      scheme          = "http"
      honor_labels    = true
      forward_to      = [prometheus.remote_write.default.receiver]
    }

    prometheus.scrape "cert_manager" {
      targets         = discovery.kubernetes.cert_manager.targets
      scrape_interval = "15s"
      metrics_path    = "/metrics"
      scheme          = "http"
      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.remote_write "default" {
        external_labels = {
          cluster = "cloudnl",
        }
        endpoint {
            url = "http://prometheus-server.monitoring/api/v1/write"
        }
    }