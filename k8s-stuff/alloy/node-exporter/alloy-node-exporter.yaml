apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-node-exporter
data:
  config.alloy: |

    // Reads the LOCAL host's /proc, /sys, rootfs (mounted into the pod).
    prometheus.exporter.unix "node" {
      rootfs_path = "/host/root"
      sysfs_path  = "/host/sys"
      procfs_path = "/host/proc"

      // ethtool is NOT enabled by default — turn it on for deep NIC metrics.
      // netdev + netclass are already on by default; listed here for clarity.
      enable_collectors = ["ethtool"]

      // ---- NIC collectors config ----

      // Driver-level NIC stats (link state, speed, per-queue counters,
      // detailed rx/tx errors, drops, pause frames, etc.)
      ethtool {
        device_include = ".*"
        device_exclude = "^(lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*)$"
        // NICs emit hundreds of driver-specific stats. Narrow to the ones
        // that matter so you don't blow up cardinality. Widen if you need more.
        metrics_include = "^(.*_errors|.*_dropped|.*_drops|rx_.*|tx_.*|.*pause.*|.*crc.*|.*collisions.*)$"
      }

      // Standard per-interface counters (rx/tx bytes, packets, errs, drops).
      netdev {
        device_exclude = "^(lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*)$"
      }

      // Interface metadata: operstate, link speed, duplex, MTU, carrier.
      netclass {
        ignored_devices = "^(lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*)$"
      }
    }

    discovery.relabel "node" {
      targets = prometheus.exporter.unix.node.targets

      // Stamp the real node name (from downward API) onto the metrics.
      rule {
        target_label = "node"
        replacement  = sys.env("NODE_NAME")
      }
      rule {
        target_label = "instance"
        replacement  = sys.env("NODE_NAME")
      }
    }

    prometheus.scrape "node" {
      job_name        = "integrations/node_exporter"
      targets         = discovery.relabel.node.output
      scrape_interval = "60s"
      forward_to      = [prometheus.remote_write.default.receiver]
    }

    prometheus.remote_write "default" {
        external_labels = {
          cluster = "cloudnl",
        }
        endpoint {
            url = "http://prometheus-server.monitoring/api/v1/write"
        }
    }