apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-cadvisor-kubelet
data:
  config.alloy: |

    // Discover all nodes in the cluster.
    // One Alloy instance scrapes every node it finds.
    discovery.kubernetes "nodes" {
      role = "node"
    }

    // ---- Kubelet metrics (/metrics) ----
    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        target_label = "__metrics_path__"
        replacement  = "/metrics"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "kubelet" {
      job_name          = "integrations/kubernetes/kubelet"
      targets           = discovery.relabel.kubelet.output
      scheme            = "https"
      scrape_interval   = "60s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }

      forward_to = [prometheus.remote_write.default.receiver]
    }

    // ---- cAdvisor metrics (/metrics/cadvisor) ----
    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        target_label = "__metrics_path__"
        replacement  = "/metrics/cadvisor"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "cadvisor" {
      job_name          = "integrations/kubernetes/cadvisor"
      targets           = discovery.relabel.cadvisor.output
      scheme            = "https"
      scrape_interval   = "60s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }

      forward_to = [prometheus.remote_write.default.receiver]
    }


    prometheus.remote_write "default" {
        external_labels = {
          cluster = "cloudnl",
        }
        endpoint {
            url = "http://prometheus-server.monitoring/api/v1/write"
        }
    }