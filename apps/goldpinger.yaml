apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goldpinger
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: registry-1.docker.io/kaviankarimzadeh
      targetRevision: 1.1.2
      chart: goldpinger
      helm:
        releaseName: goldpinger
        valueFiles:
        - values.yaml
        - $values/values/goldpinger.yaml
    - repoURL: 'https://github.com/kaviankarimzadeh/argocd-apps.git'
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: goldpinger
  syncPolicy:
    automated: null
    syncOptions:
    - CreateNamespace=true
